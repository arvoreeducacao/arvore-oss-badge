name: refresh badges

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - '.github/workflows/refresh.yml'

permissions:
  contents: write

concurrency:
  group: refresh-badges
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: node src/cli.js build

      - run: node src/cli.js refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: commit refreshed artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add badges cards endpoint contributors.json index.html favicon.svg og.png
          if git diff --staged --quiet; then
            echo 'artwork unchanged, nothing to publish'
            exit 0
          fi
          git commit -m 'chore: refresh contributor badges, cards and site'
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            echo "push attempt $attempt lost a race, retrying"
            sleep 5
          done
          echo 'could not push after three attempts'
          exit 1
